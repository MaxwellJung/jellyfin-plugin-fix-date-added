name: release

# Publish a catalog version: git tag v1.0.0.0 && git push origin v1.0.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part version without v prefix (e.g. 1.0.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  TARGET_ABI: '10.11.10.0'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          dotnet build Jellyfin.Plugin.FixDateAdded -c Release \
            -p:Version="${{ steps.ver.outputs.version }}" \
            -p:AssemblyVersion="${{ steps.ver.outputs.version }}" \
            -p:FileVersion="${{ steps.ver.outputs.version }}" \
            -p:RestoreLockedMode=true -v q -nologo

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE=$(mktemp -d)
          cp Jellyfin.Plugin.FixDateAdded/bin/Release/net9.0/Jellyfin.Plugin.FixDateAdded.dll "$STAGE/"
          jq --arg v "$VERSION" '.version=$v' meta.json > "$STAGE/meta.json"
          ZIP="Jellyfin.Plugin.FixDateAdded_${VERSION}.zip"
          (cd "$STAGE" && zip -q -r "$OLDPWD/$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Checkout main for manifest update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json
        working-directory: main-branch
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          CHKSUM="${{ steps.pkg.outputs.checksum }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq \
            --arg v "$VERSION" \
            --arg c "$CHKSUM" \
            --arg s "$SOURCE_URL" \
            --arg t "$TIMESTAMP" \
            --arg abi "$TARGET_ABI" \
            '.[0].versions |= ([{
              version: $v,
              changelog: "See GitHub release notes.",
              targetAbi: $abi,
              sourceUrl: $s,
              checksum: $c,
              timestamp: $t
            }] + [.[] | select(.version != $v)])' \
            manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest for ${TAG}"
          git push origin HEAD:main
