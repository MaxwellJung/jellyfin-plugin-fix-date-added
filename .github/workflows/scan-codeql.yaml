name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  call:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@master
    with:
      repository-name: MaxwellJung/jellyfin-plugin-fix-date-added
      dotnet-version: '9.0.x'
