name: release-please

# Opens/updates a Release PR from conventional commits on main.
# Merging that PR is the "release button": it tags, creates a GitHub Release,
# then this workflow packages the Jellyfin plugin zip and opens a catalog PR.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  TARGET_ABI: '10.11.10.0'

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-plugin:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          dotnet build Jellyfin.Plugin.FixDateAdded -c Release \
            -p:Version="${VERSION}" \
            -p:AssemblyVersion="${VERSION}.0" \
            -p:FileVersion="${VERSION}.0" \
            -p:RestoreLockedMode=true -v q -nologo

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          STAGE=$(mktemp -d)
          cp Jellyfin.Plugin.FixDateAdded/bin/Release/net9.0/Jellyfin.Plugin.FixDateAdded.dll "$STAGE/"
          jq --arg v "$VERSION" '.version=$v' meta.json > "$STAGE/meta.json"
          ZIP="Jellyfin.Plugin.FixDateAdded_${VERSION}.zip"
          (cd "$STAGE" && zip -q -r "$OLDPWD/$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.pkg.outputs.tag }}" "${{ steps.pkg.outputs.zip }}" --clobber

      - name: Checkout main for manifest update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-branch

      - name: Open PR to update manifest.json
        working-directory: main-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="${{ steps.pkg.outputs.tag }}"
          CHKSUM="${{ steps.pkg.outputs.checksum }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BRANCH="chore/manifest-${TAG}"
          jq \
            --arg v "$VERSION" \
            --arg c "$CHKSUM" \
            --arg s "$SOURCE_URL" \
            --arg t "$TIMESTAMP" \
            --arg abi "$TARGET_ABI" \
            '.[0].versions |= ([{
              version: $v,
              changelog: "See GitHub release notes.",
              targetAbi: $abi,
              sourceUrl: $s,
              checksum: $c,
              timestamp: $t
            }] + [.[] | select(.version != $v)])' \
            manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add manifest.json
          git commit -m "chore: update manifest for ${TAG}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update manifest for ${TAG}" \
            --body "Automated catalog update for release ${TAG}."
          gh pr merge --squash --delete-branch || \
            echo "Opened PR for manifest update; merge manually if branch protection blocks the bot."
