name: release-please

# Merge the Release PR to tag + GitHub Release; then this job zips the plugin
# and pushes catalog manifest.json (needs RELEASE_PLEASE_TOKEN; admins not
# enforced on main). Git keeps 3-part semver; publish maps to Jellyfin X.Y.Z.0.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  TARGET_ABI: '10.11.10.0'

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-plugin:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-please.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected 3-part semver X.Y.Z, got: ${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jf_version=${VERSION}.0" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          JF_VERSION="${{ steps.ver.outputs.jf_version }}"
          dotnet build Jellyfin.Plugin.FixDateAdded -c Release \
            -p:Version="${VERSION}" \
            -p:AssemblyVersion="${JF_VERSION}" \
            -p:FileVersion="${JF_VERSION}" \
            -p:RestoreLockedMode=true -v q -nologo

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          JF_VERSION="${{ steps.ver.outputs.jf_version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          STAGE=$(mktemp -d)
          cp Jellyfin.Plugin.FixDateAdded/bin/Release/net9.0/Jellyfin.Plugin.FixDateAdded.dll "$STAGE/"
          jq --arg v "$JF_VERSION" '.version=$v' meta.json > "$STAGE/meta.json"
          ZIP="Jellyfin.Plugin.FixDateAdded_${JF_VERSION}.zip"
          (cd "$STAGE" && zip -q -r "$OLDPWD/$ZIP" .)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "checksum=$(md5sum "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$JF_VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.pkg.outputs.tag }}" "${{ steps.pkg.outputs.zip }}" --clobber

      - name: Checkout main for manifest update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-branch
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Push manifest.json update to main
        working-directory: main-branch
        run: |
          set -euo pipefail
          JF_VERSION="${{ steps.pkg.outputs.version }}"
          TAG="${{ steps.pkg.outputs.tag }}"
          CHKSUM="${{ steps.pkg.outputs.checksum }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq \
            --arg v "$JF_VERSION" \
            --arg c "$CHKSUM" \
            --arg s "$SOURCE_URL" \
            --arg t "$TIMESTAMP" \
            --arg abi "$TARGET_ABI" \
            '.[0].versions |= ([{
              version: $v,
              changelog: "See GitHub release notes.",
              targetAbi: $abi,
              sourceUrl: $s,
              checksum: $c,
              timestamp: $t
            }] + [.[] | select(.version != $v)])' \
            manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date for ${TAG}"
            exit 0
          fi
          git commit -m "chore: update manifest for ${TAG}"
          git push origin HEAD:main
